<div class="auth-page">
  <div class="auth-card">
    <h1>Login</h1>
    <p class="auth-subtitle">Sign in to manage your watchlists and alerts</p>

    @if (error) {
      <div class="auth-error">{{ error }}</div>
    }

    <form (ngSubmit)="login()">
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="form-input" id="email" type="email" [(ngModel)]="email" name="email"
               placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" id="password" type="password" [(ngModel)]="password" name="password"
               placeholder="Your password" required>
      </div>
      <button class="btn-submit" type="submit" [disabled]="loading || !email || !password">
        {{ loading ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>

    <p class="auth-link">
      Don't have an account? <a routerLink="/register">Register</a>
    </p>
  </div>
</div>
