<div class="auth-page">
  <div class="auth-card">
    <h1>Create Account</h1>
    <p class="auth-subtitle">Register to track stocks and set alerts</p>

    @if (error) {
      <div class="auth-error">{{ error }}</div>
    }

    <form (ngSubmit)="register()">
      <div class="form-group">
        <label class="form-label" for="name">Display Name</label>
        <input class="form-input" id="name" type="text" [(ngModel)]="displayName" name="displayName"
               placeholder="John Doe" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="form-input" id="email" type="email" [(ngModel)]="email" name="email"
               placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" id="password" type="password" [(ngModel)]="password" name="password"
               placeholder="Min. 6 characters" required minlength="6">
      </div>
      <button class="btn-submit" type="submit"
              [disabled]="loading || !email || !password || !displayName">
        {{ loading ? 'Creating account...' : 'Create Account' }}
      </button>
    </form>

    <p class="auth-link">
      Already have an account? <a routerLink="/login">Sign in</a>
    </p>
  </div>
</div>
